<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Chains — Five Generation Methods</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0B0D11; color: #E8E8E8; font-family: 'IBM Plex Sans', 'SF Pro', system-ui, sans-serif; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const ENERGY_COLORS = {
  Chemical: { bg: "#2D1B0E", text: "#F5D5A0", border: "#8B6914" },
  Nuclear: { bg: "#1A0A2E", text: "#D4A5FF", border: "#7B2FBE" },
  Thermal: { bg: "#7A1A1A", text: "#FFD4C4", border: "#D94F30" },
  Kinetic: { bg: "#0A3D2A", text: "#A8F0D4", border: "#2ECC71" },
  Electrical: { bg: "#0C2D48", text: "#90D5FF", border: "#2196F3" },
  Light: { bg: "#5C4A00", text: "#FFF3B0", border: "#FFD700" },
  "Gravitational Potential": { bg: "#1A2744", text: "#B8D4F0", border: "#5B8DBE" },
};

const ARROW_COLORS = { T: "#3498DB", X: "#E74C3C" };

const chains = [
  {
    name: "Coal-Fired Power Station",
    type: "Non-renewable",
    icon: "\u{1F3ED}",
    steps: [
      { energy: "Chemical", label: "Coal", detail: "Stored in fossil fuel" },
      { energy: "Thermal", label: "Boiler", detail: "Combustion releases heat" },
      { energy: "Thermal", label: "Steam", detail: "Water heated to steam" },
      { energy: "Kinetic", label: "Steam Flow", detail: "High-pressure movement" },
      { energy: "Kinetic", label: "Turbine", detail: "Blades pushed by steam" },
      { energy: "Electrical", label: "Generator", detail: "Electromagnetic induction" },
      { energy: "Electrical", label: "Grid", detail: "Power lines" },
    ],
    arrows: ["X", "T", "X", "T", "X", "T"],
    highlight: { step: 1, note: "CO\u2082 produced here", color: "#E74C3C" },
  },
  {
    name: "Nuclear Power Station",
    type: "Non-renewable",
    icon: "\u269B\uFE0F",
    steps: [
      { energy: "Nuclear", label: "Uranium", detail: "Fuel rods in reactor" },
      { energy: "Thermal", label: "Reactor", detail: "Fission releases heat" },
      { energy: "Thermal", label: "Steam", detail: "Heat exchanger" },
      { energy: "Kinetic", label: "Steam Flow", detail: "High-pressure movement" },
      { energy: "Kinetic", label: "Turbine", detail: "Blades pushed by steam" },
      { energy: "Electrical", label: "Generator", detail: "Electromagnetic induction" },
      { energy: "Electrical", label: "Grid", detail: "Power lines" },
    ],
    arrows: ["X", "T", "X", "T", "X", "T"],
    highlight: { step: 1, note: "No CO\u2082 \u2014 fission, not combustion", color: "#2ECC71" },
  },
  {
    name: "Onshore Wind Turbine",
    type: "Renewable",
    icon: "\u{1F32C}\uFE0F",
    steps: [
      { energy: "Kinetic", label: "Wind", detail: "Moving air" },
      { energy: "Kinetic", label: "Blades", detail: "Turbine rotates" },
      { energy: "Kinetic", label: "Shaft", detail: "Gearbox transfers rotation" },
      { energy: "Electrical", label: "Generator", detail: "Electromagnetic induction" },
      { energy: "Electrical", label: "Grid", detail: "Transformer & power lines" },
    ],
    arrows: ["T", "T", "X", "T"],
    highlight: { step: 0, note: "Uncontrollable \u2014 depends on wind", color: "#F39C12" },
  },
  {
    name: "Solar Photovoltaic (PV)",
    type: "Renewable",
    icon: "\u2600\uFE0F",
    steps: [
      { energy: "Light", label: "Sunlight", detail: "Photons from the sun" },
      { energy: "Electrical", label: "PV Cell", detail: "Photons excite electrons (DC)" },
      { energy: "Electrical", label: "Wires", detail: "DC current to inverter" },
      { energy: "Electrical", label: "Inverter", detail: "Converts DC \u2192 AC" },
      { energy: "Electrical", label: "Grid", detail: "AC to appliances" },
    ],
    arrows: ["X", "T", "X", "T"],
    highlight: { step: 0, note: "Uncontrollable \u2014 depends on sun", color: "#F39C12" },
  },
  {
    name: "Hydroelectric Dam",
    type: "Renewable",
    icon: "\u{1F4A7}",
    steps: [
      { energy: "Gravitational Potential", label: "Reservoir", detail: "Water stored at height" },
      { energy: "Kinetic", label: "Penstock", detail: "Water falls/flows downhill" },
      { energy: "Kinetic", label: "Turbine", detail: "Water pushes blades" },
      { energy: "Electrical", label: "Generator", detail: "Electromagnetic induction" },
      { energy: "Electrical", label: "Grid", detail: "Power lines" },
    ],
    arrows: ["X", "T", "X", "T"],
    highlight: { step: 0, note: "Mostly controllable \u2014 but needs rainfall", color: "#3498DB" },
  },
];

function StepBox({ step, index, isHighlighted, highlightInfo }) {
  const c = ENERGY_COLORS[step.energy];
  return (
    <div style={{ position: "relative", display: "flex", flexDirection: "column", alignItems: "center" }}>
      {isHighlighted && (
        <div style={{
          position: "absolute", top: -32, left: "50%", transform: "translateX(-50%)",
          background: highlightInfo.color, color: "#fff", fontSize: 11, fontWeight: 700,
          padding: "3px 10px", borderRadius: 10, whiteSpace: "nowrap", letterSpacing: 0.3,
          boxShadow: `0 2px 8px ${highlightInfo.color}66`,
        }}>
          {highlightInfo.note}
        </div>
      )}
      <div style={{
        width: 110, minHeight: 88, borderRadius: 12, border: `2.5px solid ${c.border}`,
        background: c.bg, display: "flex", flexDirection: "column", alignItems: "center",
        justifyContent: "center", padding: "8px 6px", position: "relative",
        boxShadow: isHighlighted
          ? `0 0 16px ${highlightInfo.color}55, 0 2px 6px rgba(0,0,0,0.3)`
          : "0 2px 6px rgba(0,0,0,0.25)",
      }}>
        <div style={{
          position: "absolute", top: -10, left: "50%", transform: "translateX(-50%)",
          background: c.border, color: "#fff", fontSize: 9, fontWeight: 800,
          padding: "1px 8px", borderRadius: 8, letterSpacing: 1, textTransform: "uppercase",
        }}>
          {step.energy}
        </div>
        <div style={{ color: c.text, fontWeight: 800, fontSize: 14, marginTop: 4, textAlign: "center", lineHeight: 1.2 }}>
          {step.label}
        </div>
        <div style={{ color: c.text, fontSize: 10, opacity: 0.75, textAlign: "center", marginTop: 3, lineHeight: 1.3 }}>
          {step.detail}
        </div>
      </div>
    </div>
  );
}

function Arrow({ type, idx }) {
  const color = ARROW_COLORS[type];
  const label = type === "X" ? "Transformation" : "Transfer";
  const markerId = `arrowhead-${type}-${idx}`;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: 64 }}>
      <div style={{ fontSize: 9, fontWeight: 800, color, letterSpacing: 0.5, marginBottom: 2 }}>
        [{type}]
      </div>
      <svg width="48" height="20" viewBox="0 0 48 20">
        <defs>
          <marker id={markerId} markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill={color} />
          </marker>
        </defs>
        <line x1="0" y1="10" x2="38" y2="10" stroke={color} strokeWidth="2.5" markerEnd={`url(#${markerId})`} />
      </svg>
      <div style={{ fontSize: 8, color: "#888", marginTop: 1 }}>{label}</div>
    </div>
  );
}

function ChainDiagram({ chain }) {
  return (
    <div style={{ marginBottom: 28 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
        <span style={{ fontSize: 26 }}>{chain.icon}</span>
        <h3 style={{ margin: 0, fontSize: 18, fontWeight: 800, color: "#E8E8E8", letterSpacing: -0.3 }}>
          {chain.name}
        </h3>
        <span style={{
          fontSize: 10, fontWeight: 700, padding: "2px 10px", borderRadius: 10,
          background: chain.type === "Renewable" ? "#0A3D2A" : "#3D1A0A",
          color: chain.type === "Renewable" ? "#A8F0D4" : "#FFB88C",
          border: `1px solid ${chain.type === "Renewable" ? "#2ECC71" : "#D94F30"}`,
        }}>
          {chain.type}
        </span>
        <span style={{ fontSize: 11, color: "#888", fontWeight: 600 }}>
          {chain.steps.length} steps &bull; {chain.arrows.filter(a => a === "X").length} transformation{chain.arrows.filter(a => a === "X").length !== 1 ? "s" : ""}
        </span>
      </div>
      <div style={{
        display: "flex", alignItems: "center", flexWrap: "wrap", gap: "4px 0",
        padding: "32px 16px 16px", background: "#111318", borderRadius: 14,
        border: "1px solid #2a2d35", overflowX: "auto",
      }}>
        {chain.steps.map((step, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center" }}>
            <StepBox
              step={step}
              index={i}
              isHighlighted={chain.highlight && chain.highlight.step === i}
              highlightInfo={chain.highlight}
            />
            {i < chain.steps.length - 1 && <Arrow type={chain.arrows[i]} idx={`${chain.name}-${i}`} />}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [selected, setSelected] = useState(null);
  const displayed = selected !== null ? [chains[selected]] : chains;

  return (
    <div style={{ minHeight: "100vh", padding: "24px 20px" }}>
      <div style={{ maxWidth: 1080, margin: "0 auto" }}>
        <h1 style={{ fontSize: 28, fontWeight: 900, color: "#fff", margin: 0, letterSpacing: -0.5 }}>
          Energy Chains &mdash; Five Generation Methods
        </h1>
        <p style={{ color: "#888", fontSize: 13, margin: "6px 0 20px", lineHeight: 1.5 }}>
          <span style={{ color: ARROW_COLORS.X, fontWeight: 800 }}>[X]</span> = Transformation (energy changes form)
          <span style={{ margin: "0 14px", color: "#444" }}>|</span>
          <span style={{ color: ARROW_COLORS.T, fontWeight: 800 }}>[T]</span> = Transfer (same form, different object)
        </p>

        <div style={{ display: "flex", gap: 6, marginBottom: 24, flexWrap: "wrap" }}>
          <button
            onClick={() => setSelected(null)}
            style={{
              padding: "6px 14px", borderRadius: 8, border: "1px solid #333",
              background: selected === null ? "#2a2d35" : "transparent",
              color: selected === null ? "#fff" : "#888",
              fontSize: 12, fontWeight: 700, cursor: "pointer",
            }}
          >All</button>
          {chains.map((c, i) => (
            <button
              key={i}
              onClick={() => setSelected(selected === i ? null : i)}
              style={{
                padding: "6px 14px", borderRadius: 8, border: "1px solid #333",
                background: selected === i ? "#2a2d35" : "transparent",
                color: selected === i ? "#fff" : "#888",
                fontSize: 12, fontWeight: 700, cursor: "pointer",
              }}
            >{c.icon} {c.name.split(" ")[0]}</button>
          ))}
        </div>

        {displayed.map((chain) => (
          <ChainDiagram key={chain.name} chain={chain} />
        ))}

        <div style={{
          marginTop: 28, padding: 20, background: "#111318", borderRadius: 14,
          border: "1px solid #2a2d35",
        }}>
          <h3 style={{ margin: "0 0 12px", fontSize: 15, fontWeight: 800, color: "#F39C12" }}>
            Key Pattern
          </h3>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, fontSize: 13, lineHeight: 1.6 }}>
            <div style={{ padding: 14, background: "#1a1d24", borderRadius: 10, border: "1px solid #2a2d35" }}>
              <div style={{ fontWeight: 800, color: "#D94F30", marginBottom: 6 }}>Coal &amp; Nuclear (7 steps)</div>
              <div style={{ color: "#bbb" }}>
                Long chains with a <strong style={{ color: "#FFD4C4" }}>thermal stage</strong> &mdash; need cooling towers, produce waste heat. <strong style={{ color: "#A8F0D4" }}>Control their fuel</strong> = reliable output. Coal&rsquo;s combustion step produces CO&#8322;; nuclear&rsquo;s fission does not.
              </div>
            </div>
            <div style={{ padding: 14, background: "#1a1d24", borderRadius: 10, border: "1px solid #2a2d35" }}>
              <div style={{ fontWeight: 800, color: "#2ECC71", marginBottom: 6 }}>Wind, Solar &amp; Hydro (5 steps)</div>
              <div style={{ color: "#bbb" }}>
                Short chains that <strong style={{ color: "#FFD4C4" }}>skip the thermal stage</strong> entirely &mdash; no combustion, no fuel cost, no operational emissions. <strong style={{ color: "#FFF3B0" }}>Depend on nature</strong> = intermittent (except hydro, mostly controllable).
              </div>
            </div>
          </div>
          <div style={{ marginTop: 14, fontSize: 12, color: "#888", fontStyle: "italic", textAlign: "center" }}>
            The chain explains the data table: cost, emissions, and reliability are consequences of how the chain works.
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
